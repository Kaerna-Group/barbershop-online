<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>Redirecționare…</title>
    <script>
      ;(function () {
        var location = window.location
        var segmentsToKeep = 1
        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            location.pathname
              .split('/')
              .slice(0, 1 + segmentsToKeep)
              .join('/') +
            '/?/' +
            location.pathname
              .slice(1)
              .split('/')
              .slice(segmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (location.search
              ? '&' + location.search.slice(1).replace(/&/g, '~and~')
              : '') +
            location.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
