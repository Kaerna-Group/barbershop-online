project_id = "barbershop-online"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://kaerna-group.github.io/barbershop-online/"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://kaerna-group.github.io/barbershop-online/**"
]
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Codul tău pentru programare"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.send-notifications]
verify_jwt = true
