project_id = "barbershop-online"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://kaerna-group.github.io/barbershop-online/"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://kaerna-group.github.io/barbershop-online/**"
]
enable_signup = true
minimum_password_length = 10

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Codul tău pentru programare este {{ .Code }}"
max_frequency = "60s"

[functions.send-notifications]
verify_jwt = true
